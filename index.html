<script>
const TEMPLATES = {
  classic: { name: 'Classique', desc: 'Playfair + Lora, élégant' },
  modern: { name: 'Moderne', desc: 'Inter, aéré et net' },
  romance: { name: 'Roman', desc: 'Crimson, traditionnel' },
  minimal: { name: 'Minimaliste', desc: 'Inter, épuré' }
};

const state = {
  meta: {
    title: 'Mon premier ebook',
    subtitle: 'Un guide pratique',
    author: 'Auteur',
    coverColor1: '#FF3366',
    coverColor2: '#7C4DFF',
    coverImage: null
  },
  design: {
    template: 'classic',
    accent: '#FF3366',
    fontSelect: 'classic',
    fontSize: 12,
    lineHeight: 1.65,
    headerText: '',
    footerText: '',
    showPageNum: true
  },
  chapters: [
    { id: Date.now(), title: 'Introduction', subtitle: '', content: 'Bienvenue dans ce livre.', images: [], imagePosition: 'center' }
  ],
  view: 'cover',
  currentChapter: 0
};

const $ = id => document.getElementById(id);

function saveLocal() {
  try {
    localStorage.setItem('ebookforge_state', JSON.stringify(state));
    setStatus('💾 Sauvegardé', 'ok');
  } catch (e) { setStatus('⚠️ Stockage plein', ''); }
}
function loadLocal() {
  try {
    const s = localStorage.getItem('ebookforge_state');
    if (s) Object.assign(state, JSON.parse(s));
  } catch (e) { console.warn(e); }
}
let saveTimer;
function saveDelayed() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveLocal, 800);
}
function setStatus(msg, cls) {
  const el = $('status');
  if (el) { el.textContent = msg; el.className = 'status ' + (cls || ''); }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatText(text) {
  if (!text) return '';
  return text.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('## ')) return '<h3>' + escapeHTML(p.slice(3)) + '</h3>';
    if (p.startsWith('# ')) return '<h3 style="font-size:18px">' + escapeHTML(p.slice(2)) + '</h3>';
    let h = escapeHTML(p);
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return '<p>' + h + '</p>';
  }).join('');
}

function getFonts() {
  const map = {
    classic: { h: "'Playfair Display', serif", b: "'Lora', serif" },
    modern: { h: "'Inter', sans-serif", b: "'Inter', sans-serif" },
    romance: { h: "'Playfair Display', serif", b: "'Crimson Text', serif" },
    merriweather: { h: "'Merriweather', serif", b: "'Merriweather', serif" },
    mixed: { h: "'Playfair Display', serif", b: "'Inter', sans-serif" }
  };
  return map[state.design.fontSelect || 'classic'] || map.classic;
}

function applyFont() {
  const f = getFonts();
  document.querySelectorAll('.page-chapter h2, .page-chapter h3, .page-subtitle').forEach(el => { el.style.fontFamily = f.h; });
  document.querySelectorAll('.page-chapter p').forEach(el => { el.style.fontFamily = f.b; });
}

function buildHeaderFooter(pageNum) {
  let html = '';
  if (state.design.headerText) html += '<div class="page-header">' + escapeHTML(state.design.headerText) + '</div>';
  if (state.design.footerText) html += '<div class="page-footer">' + escapeHTML(state.design.footerText) + '</div>';
  if (state.design.showPageNum) html += '<div class="page-num">' + pageNum + '</div>';
  return html;
}

function buildCoverHTML() {
  const m = state.meta;
  const bg = m.coverImage
    ? "background-image:url('" + m.coverImage + "')"
    : 'background:linear-gradient(135deg,' + m.coverColor1 + ',' + m.coverColor2 + ')';
  return '<div class="page" style="padding:0"><div class="page-cover" style="' + bg + '"><div class="content"><div class="top">Ebook</div><div class="mid"><h1>' + escapeHTML(m.title || 'Sans titre') + '</h1>' + (m.subtitle ? '<div class="sub">' + escapeHTML(m.subtitle) + '</div>' : '') + '</div><div class="author">' + escapeHTML(m.author || '') + '</div></div></div></div>';
}

function buildTOCHTML() {
  const list = state.chapters.map(c => '<li><span style="flex:1">' + escapeHTML(c.title || 'Sans titre') + '</span></li>').join('');
  return '<div class="page tpl-' + state.design.template + '" style="--accent:' + state.design.accent + '"><div class="page-inner"><div class="page-toc" style="counter-reset:toc"><h1>Sommaire</h1><ol>' + list + '</ol></div></div></div>';
}

function buildImagesHTML(images, position) {
  if (!images || images.length === 0) return '';
  if (position === 'left') {
    return '<div class="clearfix">' + images.map(im => '<img src="' + im.src + '" class="img-float-left"/>').join('') + '</div>';
  }
  if (position === 'right') {
    return '<div class="clearfix">' + images.map(im => '<img src="' + im.src + '" class="img-float-right"/>').join('') + '</div>';
  }
  if (position === 'top') {
    return '<div class="img-top">' + images.map(im => '<img src="' + im.src + '" class="img-center" style="max-height:200px"/>').join('') + '</div>';
  }
  if (position === 'bottom') {
    return '<div class="img-bottom">' + images.map(im => '<img src="' + im.src + '" class="img-center" style="max-height:200px"/>').join('') + '</div>';
  }
  return images.map(im => '<img src="' + im.src + '" class="img-center"/>').join('');
}

function buildChapterHTML(idx, pageNum) {
  const ch = state.chapters[idx];
  if (!ch) return '';
  const imgHTML = buildImagesHTML(ch.images, ch.imagePosition || 'center');
  const pos = ch.imagePosition || 'center';
  const subtitleHTML = ch.subtitle ? '<div class="page-subtitle">' + escapeHTML(ch.subtitle) + '</div>' : '';
  let inner = '<h2>' + escapeHTML(ch.title || 'Sans titre') + '</h2>' + subtitleHTML;
  if (pos === 'top') inner += imgHTML;
  inner += '<div class="chapter-text clearfix">' + formatText(ch.content) + '</div>';
  if (pos === 'bottom') inner += imgHTML;
  return '<div class="page tpl-' + state.design.template + '" style="--accent:' + state.design.accent + '"><div class="page-inner">' + buildHeaderFooter(pageNum || 1) + '<div class="page-chapter">' + inner + '</div></div></div>';
}

function buildCurrentPreview() {
  let html = '';
  if (state.view === 'cover') html = buildCoverHTML();
  else if (state.view === 'toc') html = buildTOCHTML();
  else html = buildChapterHTML(state.currentChapter, state.currentChapter + 3);
  $('previewPage').innerHTML = html;
  const page = $('previewPage').querySelector('.page-chapter');
  if (page) {
    page.querySelectorAll('p').forEach(p => {
      p.style.fontSize = state.design.fontSize + 'px';
      p.style.lineHeight = state.design.lineHeight;
    });
    page.querySelectorAll('h3').forEach(h => { h.style.fontSize = (state.design.fontSize + 2) + 'px'; });
    page.querySelectorAll('h2').forEach(h => { h.style.fontSize = (state.design.fontSize + 10) + 'px'; });
  }
  applyFont();
  const total = 2 + state.chapters.length;
  const cur = state.view === 'cover' ? 1 : (state.view === 'toc' ? 2 : 3 + state.currentChapter);
  $('previewStatus').textContent = 'Page ' + cur + ' / ' + total;
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
}

function renderTemplates() {
  const el = $('templates');
  el.innerHTML = '';
  Object.entries(TEMPLATES).forEach(([k, t]) => {
    const d = document.createElement('div');
    d.className = 'tpl' + (k === state.design.template ? ' active' : '');
    d.innerHTML = '<div class="t">' + t.name + '</div><div class="d">' + t.desc + '</div>';
    d.onclick = () => { state.design.template = k; renderTemplates(); buildCurrentPreview(); saveDelayed(); };
    el.appendChild(d);
  });
}

function renderChapters() {
  const el = $('chaptersList');
  el.innerHTML = '';
  state.chapters.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'chapter-item' + (i === state.currentChapter ? ' active' : '');
    d.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="name">' + escapeHTML(c.title || 'Sans titre') + '</span><button class="del" data-i="' + i + '">✕</button>';
    d.onclick = (e) => {
      if (e.target.classList.contains('del')) {
        if (state.chapters.length <= 1) { alert('Garde au moins un chapitre.'); return; }
        if (!confirm('Supprimer ce chapitre ?')) return;
        state.chapters.splice(+e.target.dataset.i, 1);
        if (state.currentChapter >= state.chapters.length) state.currentChapter = state.chapters.length - 1;
        renderChapters(); loadChapterIntoEditor(); buildCurrentPreview(); saveDelayed();
        return;
      }
      state.currentChapter = i; state.view = 'chapter';
      renderChapters(); loadChapterIntoEditor(); buildCurrentPreview();
    };
    el.appendChild(d);
  });
}

function renderChapterImages() {
  const el = $('chapterImagesGrid');
  const ch = state.chapters[state.currentChapter];
  el.innerHTML = '';
  if (!ch) return;
  (ch.images || []).forEach((im, i) => {
    const d = document.createElement('div');
    d.className = 'img-thumb';
    d.innerHTML = '<img src="' + im.src + '"/><button class="x" data-i="' + i + '">✕</button>';
    el.appendChild(d);
  });
  el.querySelectorAll('.x').forEach(b => {
    b.onclick = () => { ch.images.splice(+b.dataset.i, 1); renderChapterImages(); buildCurrentPreview(); saveDelayed(); };
  });
}

function renderImagePosition() {
  const el = $('imgPosition');
  const ch = state.chapters[state.currentChapter];
  el.innerHTML = '';
  [['top', '↑ Haut'], ['center', '◯ Milieu'], ['bottom', '↓ Bas'], ['left', '← Gauche'], ['right', '→ Droite']].forEach(([k, lb]) => {
    const b = document.createElement('button');
    b.className = 'btn' + ((ch.imagePosition || 'center') === k ? ' active' : '');
    b.textContent = lb;
    b.onclick = () => { ch.imagePosition = k; renderImagePosition(); buildCurrentPreview(); saveDelayed(); };
    el.appendChild(b);
  });
}

function updateWordCount() {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  const words = (ch.content || '').trim().split(/\s+/).filter(w => w).length;
  $('wordCount').textContent = words + ' mots · ' + (ch.content || '').length + ' caractères';
}

function loadChapterIntoEditor() {
  const ch = state.chapters[state.currentChapter];
  if (!ch) return;
  $('chapterTitle').value = ch.title || '';
  $('chapterSubtitle').value = ch.subtitle || '';
  $('chapterContent').value = ch.content || '';
  renderChapterImages(); renderImagePosition(); updateWordCount();
}

function loadMetaIntoUI() {
  $('metaTitle').value = state.meta.title || '';
  $('metaSubtitle').value = state.meta.subtitle || '';
  $('metaAuthor').value = state.meta.author || '';
  $('coverColor1').value = state.meta.coverColor1;
  $('coverColor2').value = state.meta.coverColor2;
  $('accentColor').value = state.design.accent;
  $('fontSelect').value = state.design.fontSelect || 'classic';
  $('fontSize').value = state.design.fontSize;
  $('fontSizeLabel').textContent = state.design.fontSize + 'pt';
  $('lineHeight').value = Math.round(state.design.lineHeight * 100);
  $('lineHeightLabel').textContent = state.design.lineHeight.toFixed(2);
  $('headerText').value = state.design.headerText || '';
  $('footerText').value = state.design.footerText || '';
  $('showPageNum').checked = state.design.showPageNum !== false;
}

function fileToResizedDataURL(file, maxW) {
  maxW = maxW || 1200;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
}

$('metaTitle').addEventListener('input', e => { state.meta.title = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('metaSubtitle').addEventListener('input', e => { state.meta.subtitle = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('metaAuthor').addEventListener('input', e => { state.meta.author = e.target.value; buildCurrentPreview(); saveDelayed(); });
['coverColor1', 'coverColor2'].forEach(id => {
  $(id).addEventListener('input', e => { state.meta[id] = e.target.value; buildCurrentPreview(); saveDelayed(); });
});
$('accentColor').addEventListener('input', e => { state.design.accent = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('fontSelect').addEventListener('change', e => { state.design.fontSelect = e.target.value; applyFont(); saveDelayed(); });
$('fontSize').addEventListener('input', e => { state.design.fontSize = parseInt(e.target.value); $('fontSizeLabel').textContent = state.design.fontSize + 'pt'; buildCurrentPreview(); saveDelayed(); });
$('lineHeight').addEventListener('input', e => { state.design.lineHeight = parseInt(e.target.value) / 100; $('lineHeightLabel').textContent = state.design.lineHeight.toFixed(2); buildCurrentPreview(); saveDelayed(); });
$('headerText').addEventListener('input', e => { state.design.headerText = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('footerText').addEventListener('input', e => { state.design.footerText = e.target.value; buildCurrentPreview(); saveDelayed(); });
$('showPageNum').addEventListener('change', e => { state.design.showPageNum = e.target.checked; buildCurrentPreview(); saveDelayed(); });

$('coverImage').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state.meta.coverImage = await fileToResizedDataURL(f, 1000); buildCurrentPreview(); saveDelayed(); }
  catch (err) { alert('Erreur image'); }
});
$('btnCoverClear').onclick = () => { state.meta.coverImage = null; buildCurrentPreview(); saveDelayed(); };
$('btnCoverRandom').onclick = () => {
  const h = Math.floor(Math.random() * 360);
  const c1 = hslToHex(h, 75, 55);
  const c2 = hslToHex((h + 40) % 360, 75, 45);
  state.meta.coverColor1 = c1; state.meta.coverColor2 = c2;
  $('coverColor1').value = c1; $('coverColor2').value = c2;
  buildCurrentPreview(); saveDelayed();
};

$('chapterTitle').addEventListener('input', e => {
  const ch = state.chapters[state.currentChapter]; if (!ch) return;
  ch.title = e.target.value; renderChapters(); buildCurrentPreview(); saveDelayed();
});
$('chapterSubtitle').addEventListener('input', e => {
  const ch = state.chapters[state.currentChapter]; if (!ch) return;
  ch.subtitle = e.target.value; buildCurrentPreview(); saveDelayed();
});
$('chapterContent').addEventListener('input', e => {
  const ch = state.chapters[state.currentChapter]; if (!ch) return;
  ch.content = e.target.value; updateWordCount(); buildCurrentPreview(); saveDelayed();
});
$('chapterImages').addEventListener('change', async e => {
  const files = Array.from(e.target.files);
  const ch = state.chapters[state.currentChapter]; if (!ch) return;
  for (const f of files) {
    try { const src = await fileToResizedDataURL(f, 1000); ch.images.push({ src: src }); }
    catch (err) { console.warn(err); }
  }
  renderChapterImages(); buildCurrentPreview(); saveDelayed();
});

$('btnAddChapter').onclick = () => {
  state.chapters.push({ id: Date.now(), title: 'Nouveau chapitre', subtitle: '', content: '', images: [], imagePosition: 'center' });
  state.currentChapter = state.chapters.length - 1;
  state.view = 'chapter';
  renderChapters(); loadChapterIntoEditor(); buildCurrentPreview(); saveDelayed();
};

document.querySelectorAll('[data-view]').forEach(b => {
  b.onclick = () => { state.view = b.dataset.view; buildCurrentPreview(); };
});
$('btnPrev').onclick = () => {
  if (state.view === 'cover') return;
  if (state.view === 'toc') { state.view = 'cover'; buildCurrentPreview(); return; }
  if (state.currentChapter > 0) { state.currentChapter--; loadChapterIntoEditor(); renderChapters(); }
  else { state.view = 'toc'; }
  buildCurrentPreview();
};
$('btnNext').onclick = () => {
  if (state.view === 'cover') { state.view = 'toc'; buildCurrentPreview(); return; }
  if (state.view === 'toc') { state.view = 'chapter'; state.currentChapter = 0; loadChapterIntoEditor(); renderChapters(); }
  else if (state.currentChapter < state.chapters.length - 1) { state.currentChapter++; loadChapterIntoEditor(); renderChapters(); }
  buildCurrentPreview();
};

$('btnExportPDF').onclick = () => {
  setStatus('📕 Préparation du PDF…', 'ok');
  const all = [buildCoverHTML(), buildTOCHTML()];
  state.chapters.forEach((c, i) => all.push(buildChapterHTML(i, i + 3)));
  const html = all.map(p => '<div class="print-page">' + p + '</div>').join('');
  $('printContainer').innerHTML = html;
  $('printContainer').querySelectorAll('.page-chapter p').forEach(p => {
    p.style.fontSize = state.design.fontSize + 'pt';
    p.style.lineHeight = state.design.lineHeight;
  });
  $('printContainer').querySelectorAll('.page-chapter h3').forEach(h => { h.style.fontSize = (state.design.fontSize + 2) + 'pt'; });
  $('printContainer').querySelectorAll('.page-chapter h2').forEach(h => { h.style.fontSize = (state.design.fontSize + 10) + 'pt'; });
  applyFont();
  setTimeout(() => { window.print(); setStatus('✅ PDF prêt', 'ok'); }, 300);
};

$('btnSaveJSON').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ebook-' + Date.now() + '.json'; a.click();
  URL.revokeObjectURL(url);
  setStatus('💾 Fichier téléchargé', 'ok');
};
$('btnLoadJSON').onclick = () => $('fileLoadJSON').click();
$('fileLoadJSON').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      Object.assign(state, JSON.parse(r.result));
      loadMetaIntoUI(); renderTemplates(); renderChapters(); loadChapterIntoEditor(); buildCurrentPreview(); saveDelayed();
      setStatus('✅ Livre chargé', 'ok');
    } catch (err) { alert('Fichier invalide'); }
  };
  r.readAsText(f);
});
$('btnNewBook').onclick = () => {
  if (!confirm('Effacer TOUT le livre actuel et repartir de zéro ?')) return;
  localStorage.clear(); sessionStorage.clear(); location.reload(true);
};

loadLocal();
loadMetaIntoUI();
renderTemplates();
renderChapters();
loadChapterIntoEditor();
buildCurrentPreview();
window.addEventListener('beforeunload', saveLocal);
setStatus('Prêt. Écris ton livre !', 'ok');
</script>
</body>
</html>
